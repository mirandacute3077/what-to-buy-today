<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OA审批系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent;}
.sig{touch-action:none;cursor:crosshair;background-image:radial-gradient(#e5e7eb 1px,transparent 1px);background-size:20px 20px;}
.fade{animation:fadeIn .3s ease-out;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:9999px;font-size:.75rem;font-weight:600}
.b-collect{background:#dbeafe;color:#1e40af}.b-pending{background:#fef3c7;color:#92400e}
.b-approve{background:#d1fae5;color:#065f46}.b-reject{background:#fee2e2;color:#991b1b}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.03)}
.btn-p{background:linear-gradient(135deg,#3b82f6,#2563eb)}.btn-g{background:linear-gradient(135deg,#10b981,#059669)}
.btn-r{background:linear-gradient(135deg,#ef4444,#dc2626)}
input,textarea,select{-webkit-appearance:none;appearance:none}
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="app" class="max-w-md mx-auto min-h-screen"></div>
<script>
const $=id=>document.getElementById(id);
function enc(d){return encodeURIComponent(btoa(encodeURIComponent(JSON.stringify(d))))}
function dec(s){try{return JSON.parse(decodeURIComponent(atob(decodeURIComponent(s))))}catch(e){return null}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function now(){const d=new Date();return today()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function copy(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('链接已复制！'))}else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('链接已复制！')}}

class SigPad{
    constructor(cid,onDone){
        this.c=$(cid);this.x=this.c.getContext('2d');this.d=false;this.h=false;this.onDone=onDone;
        const r=this.c.parentElement.getBoundingClientRect();
        this.c.width=r.width*2;this.c.height=400;this.c.style.width=r.width+'px';this.c.style.height='200px';
        this.x.scale(2,2);this.x.lineCap='round';this.x.lineJoin='round';this.x.lineWidth=2.5;this.x.strokeStyle='#1f2937';
        this.c.addEventListener('mousedown',e=>this.start(e));
        this.c.addEventListener('mousemove',e=>this.move(e));
        this.c.addEventListener('mouseup',e=>this.end(e));
        this.c.addEventListener('mouseleave',e=>this.end(e));
        this.c.addEventListener('touchstart',e=>this.start(e),{passive:false});
        this.c.addEventListener('touchmove',e=>this.move(e),{passive:false});
        this.c.addEventListener('touchend',e=>this.end(e));
    }
    pos(e){const r=this.c.getBoundingClientRect(),c=e.touches?e.touches[0]:e;return{x:c.clientX-r.left,y:c.clientY-r.top}}
    start(e){e.preventDefault();this.d=true;this.h=true;const p=this.pos(e);this.x.beginPath();this.x.moveTo(p.x,p.y)}
    move(e){e.preventDefault();if(!this.d)return;const p=this.pos(e);this.x.lineTo(p.x,p.y);this.x.stroke()}
    end(e){e.preventDefault();this.d=false}
    clear(){this.x.clearRect(0,0,this.c.width,this.c.height);this.h=false}
    save(){return this.c.toDataURL('image/png')}
}

const App={
    page:'home',data:null,
    init(){this.parse();this.render();window.addEventListener('hashchange',()=>{this.parse();this.render()})},
    parse(){const h=location.hash.slice(1);if(!h){this.page='home';this.data=null;return}const p=new URLSearchParams(h);this.page=p.get('page')||'home';const d=p.get('data');this.data=d?dec(d):null},
    go(page,data){let url='#page='+page;if(data)url+='&data='+enc(data);location.hash=url},
    url(page,data){let u=location.origin+location.pathname+'#page='+page;if(data)u+='&data='+enc(data);return u},

    render(){const a=$('app');a.innerHTML='';a.className='max-w-md mx-auto min-h-screen fade';switch(this.page){
        case'home':this.rHome(a);break;case'apply':this.rApply(a);break;case'share':this.rShare(a);break;
        case'review':this.rReview(a);break;case'approve':this.rApprove(a);break;case'detail':this.rDetail(a);break;
        default:this.rHome(a);
    }},

    rHome(c){c.innerHTML=`<div class="px-5 pt-12 pb-8"><div class="text-center mb-10">
<div class="w-20 h-20 mx-auto mb-4 rounded-2xl btn-p flex items-center justify-center shadow-lg shadow-blue-200">
<svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
<h1 class="text-2xl font-bold text-gray-900 mb-2">OA 审批系统</h1><p class="text-gray-500 text-sm">想买啥？先审批，再下单</p></div>
<div class="space-y-4"><button onclick="App.go('apply')" class="w-full py-4 px-6 btn-p text-white rounded-2xl font-semibold text-lg shadow-lg shadow-blue-200 flex items-center justify-center gap-3 active:scale-95 transition-transform">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>发起新申请</button>
<div class="card p-5 mt-6"><h3 class="font-bold text-gray-800 mb-3">使用说明</h3>
<ol class="text-sm text-gray-600 space-y-2 list-decimal list-inside"><li>点击<strong>发起新申请</strong>，填写想买的东西</li><li>提交后把链接发到微信群</li><li>朋友打开链接可以填写评价意见</li><li>至少1人评价后，可发送给<strong>王睿玥</strong>最终审批</li></ol></div>
<div class="card p-5"><h3 class="font-bold text-gray-800 mb-3">审批流程</h3><div class="flex items-center justify-between text-xs">
<div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold">1</div><span class="text-gray-600">申请</span></div>
<div class="flex-1 h-0.5 bg-gray-200 mx-2"></div><div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold">2</div><span class="text-gray-600">评价</span></div>
<div class="flex-1 h-0.5 bg-gray-200 mx-2"></div><div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold">3</div><span class="text-gray-600">审批</span></div></div></div></div></div>`},

    rApply(c){c.innerHTML=`<div class="px-5 pt-6 pb-8"><div class="flex items-center gap-3 mb-6">
<button onclick="App.go('home')" class="p-2 rounded-full hover:bg-gray-200 transition"><svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
<h2 class="text-xl font-bold text-gray-900">发起申请</h2></div>
<form id="af" class="card p-5 space-y-4"><div><label class="block text-sm font-medium text-gray-700 mb-1.5">申请人 <span class="text-red-500">*</span></label>
<input type="text" id="applicant" required placeholder="你的名字" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">想买啥 <span class="text-red-500">*</span></label>
<input type="text" id="item" required placeholder="比如：iPhone 17" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">理由 <span class="text-red-500">*</span></label>
<textarea id="reason" required rows="3" placeholder="为啥想买？" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50 resize-none"></textarea></div>
<div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-gray-700 mb-1.5">价格（元） <span class="text-red-500">*</span></label>
<input type="number" id="price" required min="0" step="0.01" placeholder="5999" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">申请日期</label>
<input type="date" id="date" value="${today()}" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50 text-gray-700"></div></div>
<button type="submit" class="w-full py-3.5 btn-p text-white rounded-xl font-semibold shadow-lg shadow-blue-200 active:scale-95 transition-transform mt-2">生成分享链接</button></form></div>`;
$('af').addEventListener('submit',e=>{e.preventDefault();this.go('share',{id:Date.now().toString(),date:$('date').value,applicant:$('applicant').value.trim(),item:$('item').value.trim(),reason:$('reason').value.trim(),price:parseFloat($('price').value),reviews:[],finalApproval:null,status:'collecting',createdAt:now()})})},

    rShare(c){if(!this.data){this.go('home');return}const d=this.data,u=this.url('review',d),n=d.reviews?d.reviews.length:0,ok=n>=1;
c.innerHTML=`<div class="px-5 pt-6 pb-8"><div class="flex items-center gap-3 mb-6">
<button onclick="App.go('home')" class="p-2 rounded-full hover:bg-gray-200 transition"><svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
<h2 class="text-xl font-bold text-gray-900">分享申请</h2></div>
<div class="card p-5 mb-5"><div class="flex items-center justify-between mb-3">
<span class="badge ${d.status=='collecting'?'b-collect':d.status=='pending'?'b-pending':d.status=='approved'?'b-approve':'b-reject'}">${d.status=='collecting'?'🔍 收集中':d.status=='pending'?'⏳ 待审批':d.status=='approved'?'✅ 已批准':'❌ 已拒绝'}</span>
<span class="text-xs text-gray-400">${d.date}</span></div>
<h3 class="text-lg font-bold text-gray-900 mb-1">${d.item}</h3><p class="text-gray-600 text-sm mb-3">${d.reason}</p>
<div class="flex items-center justify-between text-sm"><span class="text-gray-500">申请人：${d.applicant}</span><span class="text-red-500 font-bold text-lg">¥${d.price.toFixed(2)}</span></div></div>
<div class="card p-5 mb-5"><h3 class="font-bold text-gray-800 mb-3">分享评价链接</h3><p class="text-sm text-gray-500 mb-3">把下面链接发到微信群，让朋友来评价</p>
<div class="bg-gray-100 rounded-xl p-3 mb-3 break-all text-xs text-gray-600 font-mono border border-gray-200">${u}</div>
<button onclick="copy('${u}')" class="w-full py-3 bg-gray-900 text-white rounded-xl font-medium active:scale-95 transition-transform flex items-center justify-center gap-2">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>复制评价链接</button></div>
${n>0?`<div class="card p-5 mb-5"><h3 class="font-bold text-gray-800 mb-3">已有评价 (${n}人)</h3><div class="space-y-3">${d.reviews.map(r=>`<div class="bg-gray-50 rounded-xl p-3"><div class="flex items-center justify-between mb-1"><span class="font-medium text-sm text-gray-800">${r.reviewer}</span><span class="text-xs text-gray-400">${r.timestamp}</span></div><p class="text-sm text-gray-600 mb-1">${r.opinion}</p>${r.alternative?`<p class="text-xs text-blue-600">💡 平替：${r.alternative}</p>`:''}</div>`).join('')}</div></div>`:'<div class="card p-5 mb-5 text-center text-gray-400 text-sm">暂无人评价，快去分享链接吧</div>'}
<div class="card p-5"><h3 class="font-bold text-gray-800 mb-3">发送给最终审批人</h3><p class="text-sm text-gray-500 mb-3">最终审批人：<strong class="text-gray-800">王睿玥</strong></p>
${!ok?`<div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-sm text-yellow-700 flex items-start gap-2"><svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>至少需要 <strong>1个人</strong> 评价后才能提交审批</div>`:`<button onclick="App.sendApprove()" class="w-full py-3 btn-g text-white rounded-xl font-medium shadow-lg shadow-green-200 active:scale-95 transition-transform flex items-center justify-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>生成审批链接发给王睿玥</button>`}</div></div>`},

    sendApprove(){if(!this.data||!this.data.reviews||this.data.reviews.length<1){alert('至少需要1人评价');return}this.data.status='pending';copy(this.url('approve',this.data));setTimeout(()=>alert('审批链接已复制！请发送给王睿玥'),100)},

    rReview(c){if(!this.data){this.go('home');return}const d=this.data;
c.innerHTML=`<div class="px-5 pt-6 pb-8"><div class="flex items-center gap-3 mb-6">
<button onclick="App.go('home')" class="p-2 rounded-full hover:bg-gray-200 transition"><svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
<h2 class="text-xl font-bold text-gray-900">填写评价</h2></div>
<div class="card p-5 mb-5"><div class="flex items-center justify-between mb-3">
<span class="badge ${d.status=='collecting'?'b-collect':'b-pending'}">${d.status=='collecting'?'🔍 评价收集中':'⏳ 等待最终审批'}</span><span class="text-xs text-gray-400">${d.date}</span></div>
<h3 class="text-lg font-bold text-gray-900 mb-1">${d.item}</h3><p class="text-gray-600 text-sm mb-2">${d.reason}</p>
<div class="flex items-center justify-between text-sm border-t border-gray-100 pt-2 mt-2"><span class="text-gray-500">申请人：${d.applicant}</span><span class="text-red-500 font-bold">¥${d.price.toFixed(2)}</span></div></div>
${d.reviews&&d.reviews.length>0?`<div class="card p-5 mb-5"><h3 class="font-bold text-gray-800 mb-3">已有评价</h3><div class="space-y-3">${d.reviews.map(r=>`<div class="bg-gray-50 rounded-xl p-3"><div class="flex items-center justify-between mb-1"><span class="font-medium text-sm text-gray-800">${r.reviewer}</span><span class="text-xs text-gray-400">${r.timestamp}</span></div><p class="text-sm text-gray-600 mb-1">${r.opinion}</p>${r.alternative?`<p class="text-xs text-blue-600">💡 平替：${r.alternative}</p>`:''}${r.signature?`<img src="${r.signature}" class="mt-2 h-12 object-contain bg-white rounded border border-gray-200">`:''}</div>`).join('')}</div></div>`:''}
${d.status!='approved'&&d.status!='rejected'?`<form id="rf" class="card p-5 space-y-4"><h3 class="font-bold text-gray-800">你的评价</h3>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">评价人姓名 <span class="text-red-500">*</span></label>
<input type="text" id="rname" required placeholder="你的名字" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">审批意见 <span class="text-red-500">*</span></label>
<textarea id="rop" required rows="3" placeholder="你觉得该买吗？说说理由" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50 resize-none"></textarea></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">是否有平替（选填）</label>
<input type="text" id="ralt" placeholder="比如：电煮锅可以替代空气炸锅" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-gray-50"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">电子签名 <span class="text-red-500">*</span></label>
<div class="border-2 border-dashed border-gray-300 rounded-xl overflow-hidden bg-white"><canvas id="sc" class="sig w-full" style="height:200px;"></canvas></div>
<div class="flex gap-2 mt-2"><button type="button" id="cs" class="flex-1 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition">清空重写</button>
<button type="button" id="ss" class="flex-1 py-2 bg-gray-800 text-white rounded-lg text-sm font-medium hover:bg-gray-700 transition">确认签名</button></div>
<input type="hidden" id="sd"><div id="sp" class="hidden mt-2 p-2 bg-green-50 border border-green-200 rounded-lg flex items-center gap-2">
<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span class="text-sm text-green-700">签名已保存</span></div></div>
<button type="submit" class="w-full py-3.5 btn-p text-white rounded-xl font-semibold shadow-lg shadow-blue-200 active:scale-95 transition-transform">提交评价</button></form>`:''}</div>`;
if(d.status!='approved'&&d.status!='rejected'){const p=new SigPad('sc',(url)=>{$('sd').value=url;$('sp').classList.remove('hidden')});
$('cs').onclick=()=>p.clear();$('ss').onclick=()=>{if(!p.h){alert('请先签名');return}$('sd').value=p.save();$('sp').classList.remove('hidden')};
$('rf').addEventListener('submit',e=>{e.preventDefault();const rv=$('rname').value.trim(),op=$('rop').value.trim(),alt=$('ralt').value.trim(),sig=$('sd').value;
if(!sig){alert('请先签名');return}if(rv==d.applicant){alert('自己不能给自己评价哦！');return}
if(d.reviews&&d.reviews.some(r=>r.reviewer==rv)){if(!confirm('你已经评价过了，确定覆盖之前的评价吗？'))return;d.reviews=d.reviews.filter(r=>r.reviewer!=rv)}
d.reviews=d.reviews||[];d.reviews.push({reviewer:rv,opinion:op,alternative:alt,signature:sig,timestamp:now()});alert('评价成功！');this.go('share',d)})}},

    rApprove(c){if(!this.data){this.go('home');return}const d=this.data;
c.innerHTML=`<div class="px-5 pt-6 pb-8"><div class="flex items-center gap-3 mb-6">
<button onclick="App.go('home')" class="p-2 rounded-full hover:bg-gray-200 transition"><svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
<h2 class="text-xl font-bold text-gray-900">最终审批</h2></div>
<div class="bg-gradient-to-r from-purple-500 to-pink-500 rounded-2xl p-5 text-white mb-5 shadow-lg shadow-purple-200"><div class="text-xs opacity-80 mb-1">审批人专属</div><h3 class="text-lg font-bold">王睿玥</h3><p class="text-sm opacity-90 mt-1">请查看申请信息和评价后做出最终决定</p></div>
<div class="card p-5 mb-5"><h3 class="font-bold text-gray-800 mb-3">申请详情</h3><div class="space-y-2 text-sm">
<div class="flex justify-between"><span class="text-gray-500">日期</span><span class="text-gray-800">${d.date}</span></div>
<div class="flex justify-between"><span class="text-gray-500">申请人</span><span class="text-gray-800">${d.applicant}</span></div>
<div class="flex justify-between"><span class="text-gray-500">想买啥</span><span class="text-gray-800 font-medium">${d.item}</span></div>
<div class="flex justify-between"><span class="text-gray-500">价格</span><span class="text-red-500 font-bold">¥${d.price.toFixed(2)}</span></div>
<div class="pt-2 border-t border-gray-100"><span class="text-gray-500 block mb-1">理由</span><span class="text-gray-800">${d.reason}</span></div></div></div>
<div class="card p-5 mb-5"><h3 class="font-bold text-gray-800 mb-3">评价汇总 (${d.reviews?d.reviews.length:0}人)</h3>

<button type="button" id="ssa" class="flex-1 py-2 bg-gray-800 text-white rounded-lg text-sm font-medium hover:bg-gray-700 transition">确认签名</button></div>
<input type="hidden" id="sad"><div id="sap" class="hidden mt-2 p-2 bg-green-50 border border-green-200 rounded-lg flex items-center gap-2">
<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span class="text-sm text-green-700">签名已保存</span></div></div>
<button type="submit" class="w-full py-3.5 bg-gray-900 text-white rounded-xl font-semibold shadow-lg active:scale-95 transition-transform">提交审批结果</button></form>`}</div>`;
if(!(d.status=='approved'||d.status=='rejected')){const p=new SigPad('sac',(url)=>{$('sad').value=url;$('sap').classList.remove('hidden')});

alert(`已${dec.value=='approved'?'批准':'拒绝'}该申请！`);this.go('detail',d)})}},

<p class="text-sm text-gray-700 mb-3 bg-gray-50 rounded-lg p-3">${d.finalApproval.comment}</p>${d.finalApproval.signature?`<img src="${d.finalApproval.signature}" class="h-20 object-contain bg-white rounded border border-gray-200 p-1">`:''}</div>`:''}
